# Creativity Elf / MKS Robin Nano V1.2 — conservative bring-up config
# Status updated 2026-09-23:
# - The user reports all mechanical endstops are repaired and working.
# - X/Y endstops were verified: released=open, pressed=TRIGGERED; XY homing succeeded.
# - Z/Z1 polarity was updated, but those switches need individual checks before Z homing.
# - X endstop is on the right; X+ homes toward it at max. Y endstop is by the
#   screen/front; Y- homes toward it at min.
# - XY homed successfully in the 2026-09-23 test session; Z remains unhomed.
#   A fresh Klipper session starts unhomed. Earlier jog coordinates were estimated.
# No heater, extruder, or probe is configured because the print head was changed.

[mcu]
serial: /dev/ttyUSB0
restart_method: command

[printer]
kinematics: corexy
max_velocity: 5
max_accel: 50
max_z_velocity: 2
max_z_accel: 20

[stepper_x]
step_pin: PE3
dir_pin: PE2
enable_pin: !PE4
microsteps: 16
rotation_distance: 40
endstop_pin: PA15
position_endstop: 300
position_max: 300
homing_speed: 2

[stepper_y]
step_pin: PE0
dir_pin: PB9
enable_pin: !PE1
microsteps: 16
rotation_distance: 40
endstop_pin: PA12
position_endstop: 0
position_max: 300
homing_speed: 2

[stepper_z]
step_pin: PB5
dir_pin: !PB4
enable_pin: !PB8
microsteps: 16
rotation_distance: 8
endstop_pin: PA11
position_endstop: 0
position_max: 350
homing_speed: 1

# Z1 on PA6/PA1/PA3 and its endstop on PC4 are provisional.
# Verify the actual wiring and released/pressed logic before Z homing or alignment.
[stepper_z1]
step_pin: PA6
dir_pin: !PA1
enable_pin: !PA3
microsteps: 16
rotation_distance: 8
endstop_pin: PC4
