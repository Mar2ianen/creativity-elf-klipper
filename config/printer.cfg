# Creativity Elf / MKS Robin Nano V1.2 — conservative bring-up config
# Status updated 2026-09-24:
# - The user reports all mechanical endstops are repaired and working.
# - X/Y endstops were verified: released=open, pressed=TRIGGERED; XY homing succeeded.
# - Right Z switch maps to PA11/stepper_z; left Z switch maps to PC4/z1.
#   Both inputs were verified. Low-speed Z homing completed after reversing
#   both Z direction pins; both switches triggered at home. Independent motor
#   movement and gantry alignment have not been checked.
# - Bed thermistor uses PC0/TB and EPCOS 100K per upstream Robin Nano config;
#   the stock thermistor type is not independently confirmed against factory FW.
# - Bed heater output PA0/H-BED was tested in stages at 30, 50, 65, and 80 C.
#   Klipper PID calibration completed at 80 C; the stock thermistor type is
#   still not independently confirmed against factory firmware.
# - Hotend was checked at a 40 C target on PC3 with a 50 C ceiling and 50% max
#   power. User measured 44 C at the thermocouple point; Klipper peaked near
#   47.7 C after power cut from thermal inertia. Target is 0; no PID tuning.
# - PB1 was commanded to 40% briefly and returned to 0. The user reports the
#   part-cooling blower did not spin; the running heatsink fan is separate.
#   PB1's physical load and any second channel remain unidentified.
# - X endstop is on the right; X+ homes toward it at max. Y endstop is by the
#   screen/front; Y- homes toward it at min.
# - XY and Z homing were verified earlier. All axes are currently unhomed after
#   SAVE_CONFIG restarted Klipper to persist the bed PID values. Fresh sessions start unhomed.
#   Earlier jog coordinates were estimates, not calibration.
# The changed print head's thermistor uses the provisional upstream curve on
# PC1. Hotend uses conservative watermark control; no PID calibration done.

[mcu]
serial: /dev/ttyUSB0
restart_method: command

[printer]
kinematics: corexy
max_velocity: 5
max_accel: 50
max_z_velocity: 2
max_z_accel: 20

# Bed monitor and heater mapping follow Makerbase TB=PC0, H-BED=PA0 and the
# upstream MKS Robin Nano V1.2 Klipper sensor reference. Factory sensor type
# is not independently confirmed. Heater and sensor were tested on the printer;
# PID was calibrated at 80 C. max_temp remains capped at 100 C.
[heater_bed]
heater_pin: PA0
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC0
control: pid
pid_Kp: 64.814
pid_Ki: 1.583
pid_Kd: 663.529
min_temp: 0
max_temp: 100

# Staged hotend check. PC1/PC3 and the thermistor curve follow Klipper's generic
# Robin Nano V1.2 config; the changed head's sensor type remains provisional.
[heater_generic hotend]
heater_pin: PC3
sensor_type: ATC Semitec 104GT-2
sensor_pin: PC1
control: watermark
max_power: 0.5
min_temp: 0
max_temp: 50

# The board FAN output is PB1 per the Robin Nano reference config. A brief 40%
# command was accepted, but the part-cooling blower did not start. The physical
# load on PB1 is unknown; do not identify it as the heatsink fan.
[fan_generic fan_pb1]
pin: PB1
shutdown_speed: 0

# Temporary detached-feeder test. Robin Nano E0 pins follow upstream Klipper;
# user observed positive motion sends filament toward the hotend. The 7.71 mm
# baseline is 415 steps/mm for a 1.8-degree motor at 16 microsteps; actual feed
# length is not calibrated.
[manual_stepper bmg_test]
step_pin: PD6
dir_pin: !PD3
enable_pin: !PB3
microsteps: 16
rotation_distance: 7.71
velocity: 2
accel: 5
position_max: 20

[stepper_x]
step_pin: PE3
dir_pin: PE2
enable_pin: !PE4
microsteps: 16
rotation_distance: 40
endstop_pin: PA15
position_endstop: 300
position_max: 300
homing_speed: 2

[stepper_y]
step_pin: PE0
dir_pin: PB9
enable_pin: !PE1
microsteps: 16
rotation_distance: 40
endstop_pin: PA12
position_endstop: 0
position_max: 300
homing_speed: 2

[stepper_z]
step_pin: PB5
dir_pin: PB4
enable_pin: !PB8
microsteps: 16
rotation_distance: 8
endstop_pin: PA11
position_endstop: 0
position_max: 350
homing_speed: 1

# PC4/z1 was confirmed as the physical left Z endstop.
# Both Z directions below were reversed after the first Z homing attempt moved
# the portal the wrong way. A second G28 Z triggered both endstops; individual
# motor movement and gantry alignment remain unverified.
[stepper_z1]
step_pin: PA6
dir_pin: PA1
enable_pin: !PA3
microsteps: 16
rotation_distance: 8
endstop_pin: PC4
