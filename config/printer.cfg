# Creativity Elf / MKS Robin Nano V1.2 — conservative bring-up config
# Status updated 2026-09-23:
# - The user reports all mechanical endstops are repaired and working.
# - X/Y endstops were verified: released=open, pressed=TRIGGERED; XY homing succeeded.
# - Right Z switch maps to PA11/stepper_z; left Z switch maps to PC4/z1.
#   Both inputs were verified. Low-speed Z homing completed after reversing
#   both Z direction pins; both switches triggered at home. Independent motor
#   movement and gantry alignment have not been checked.
# - Read-only bed thermistor monitor uses PC0/TB and EPCOS 100K per upstream
#   Robin Nano config; latest idle reading was 18.49 C. Sensor type is not
#   independently confirmed against stock firmware. No heater is configured.
# - X endstop is on the right; X+ homes toward it at max. Y endstop is by the
#   screen/front; Y- homes toward it at min.
# - XY and Z homing were verified earlier. All axes are currently unhomed after
#   FIRMWARE_RESTART for the read-only temperature sensor. Fresh sessions start unhomed.
#   Earlier jog coordinates were estimates, not calibration.
# No heater output, extruder, or probe is configured because the print head was changed.

[mcu]
serial: /dev/ttyUSB0
restart_method: command

[printer]
kinematics: corexy
max_velocity: 5
max_accel: 50
max_z_velocity: 2
max_z_accel: 20

# Read-only bed thermistor monitor: Makerbase TB is PC0; sensor type follows
# the upstream MKS Robin Nano V1.2 Klipper config. No heater output is set here.
[temperature_sensor bed]
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC0

[stepper_x]
step_pin: PE3
dir_pin: PE2
enable_pin: !PE4
microsteps: 16
rotation_distance: 40
endstop_pin: PA15
position_endstop: 300
position_max: 300
homing_speed: 2

[stepper_y]
step_pin: PE0
dir_pin: PB9
enable_pin: !PE1
microsteps: 16
rotation_distance: 40
endstop_pin: PA12
position_endstop: 0
position_max: 300
homing_speed: 2

[stepper_z]
step_pin: PB5
dir_pin: PB4
enable_pin: !PB8
microsteps: 16
rotation_distance: 8
endstop_pin: PA11
position_endstop: 0
position_max: 350
homing_speed: 1

# PC4/z1 was confirmed as the physical left Z endstop.
# Both Z directions below were reversed after the first Z homing attempt moved
# the portal the wrong way. A second G28 Z triggered both endstops; individual
# motor movement and gantry alignment remain unverified.
[stepper_z1]
step_pin: PA6
dir_pin: PA1
enable_pin: !PA3
microsteps: 16
rotation_distance: 8
endstop_pin: PC4
